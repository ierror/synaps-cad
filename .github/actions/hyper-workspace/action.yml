name: Checkout Hyper workspace
description: Fetch the exact sibling repositories required by local path dependencies

runs:
  using: composite
  steps:
    - name: Fetch pinned Hyper repositories
      shell: bash
      run: |
        set -euo pipefail

        checkout_repo() {
          local name="$1"
          local url="$2"
          local revision="$3"
          local destination="${GITHUB_WORKSPACE}/../${name}"

          git init "${destination}"
          git -C "${destination}" remote add origin "${url}"
          git -C "${destination}" fetch --depth 1 origin "${revision}"
          git -C "${destination}" checkout --detach FETCH_HEAD
        }

        checkout_repo csgrs https://github.com/timschmidt/csgrs.git d0634cead65ccd2f870fcfcf8b46be7b0a679ab4
        checkout_repo hypercurve https://github.com/timschmidt/hypercurve.git 9c79febdd0618081ed8b5fa6f8b108de8957b8d3
        checkout_repo hyperlattice https://github.com/timschmidt/hyperlattice.git e3c74e3acc462c38be0475e6381d210efbe35a5c
        checkout_repo hyperlimit https://github.com/timschmidt/hyperlimit.git 838887426941ff5af2060aacd03597929519207f
        checkout_repo hypermesh https://github.com/timschmidt/hypermesh.git 92effa8df5d0640a66af99a7145d722b0acd78ed
        checkout_repo hyperphysics https://github.com/timschmidt/hyperphysics.git 86f84d0e470fe68bdec66459595a63cb1d8c8d7f
        checkout_repo hyperreal https://github.com/timschmidt/hyperreal.git 6f8ce9a7e600b8f32acf8313d5be6c1972c207bc
        checkout_repo hypersdf https://github.com/timschmidt/hypersdf.git ecb9811f99fdca083faae8e97624679c8ce1970c
        checkout_repo hypersolve https://github.com/timschmidt/hypersolve.git 2ec9cd754e519197dc558a2b77f12dc43265064c
        checkout_repo hypertri https://github.com/timschmidt/hypertriangulate.git 2f9b27222e2108ceffe7e2a9cf669c3c3e63a5e0
        checkout_repo openscad-rs https://github.com/timschmidt/openscad-rs.git 695af0746d8df284a7c7976e5664f4aa35f6a32a
